/* --- Авторское оформление v3 --- */
:root{
  --bg:#efe8dc;
  --surface:#fffaf3;
  --surface-soft:#f5ede2;
  --ink:#24322f;
  --muted:#6f7b76;
  --line:#e4d8c9;
  --accent:#c96e4b;
  --accent-h:#ad5a39;
  --accent-soft:#f6e5db;
  --green:#2f7a68;
  --green-soft:#dff0e9;
  --red:#a3473d;
  --shadow:0 18px 50px rgba(49,39,28,.08);
  --radius:22px;
}
html,body{background:
  radial-gradient(circle at 14% 12%, rgba(209,121,87,.13), transparent 28%),
  radial-gradient(circle at 84% 0%, rgba(64,104,92,.12), transparent 25%),
  linear-gradient(180deg,#f4ede2 0%, #efe8dc 100%);
}
body{color:var(--ink);}
body:before, body:after{content:"";position:fixed;pointer-events:none;z-index:0;border-radius:50%;filter:blur(8px)}
body:before{width:360px;height:360px;left:-120px;top:70px;background:rgba(200,110,75,.11)}
body:after{width:420px;height:420px;right:-170px;bottom:-120px;background:rgba(35,57,52,.10)}
.app,.work,.content{position:relative;z-index:1}
h1,h2,.hero h1,.modal h2,.bigprice,.amount,.brand strong{font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif;letter-spacing:-.02em}
.sidebar{
  background:linear-gradient(180deg,#1c2f2c 0%, #142321 100%);
  border-right:1px solid rgba(255,255,255,.06);
  box-shadow:inset -1px 0 0 rgba(255,255,255,.03), 22px 0 50px rgba(23,27,24,.07);
}
.brand{margin-bottom:34px}
.brandmark{
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg,#d3815e 0%, #b85e3d 100%);
  box-shadow:0 14px 25px rgba(201,110,75,.35);
}
.brand strong{font-size:22px;color:#fff5ec}
.brand span{font-size:12px;color:#b7c5bf}
.navbutton{color:#d4dfda;border-radius:14px;padding:13px 14px;font-weight:600;transition:all .18s ease}
.navbutton:hover{background:rgba(255,255,255,.075);color:#fff7ef;transform:translateX(2px)}
.navbutton.active{
  background:linear-gradient(90deg, rgba(201,110,75,.22), rgba(201,110,75,.08));
  color:#fff4ea;
  box-shadow:inset 3px 0 0 var(--accent);
}
.sidefoot{border-top:1px solid rgba(255,255,255,.08)}
.sidefoot .note{color:#a9bbb4}
#settingsNav{color:#d4dfda}
.work{margin-left:262px;width:calc(100% - 262px)}
.top{
  background:rgba(244,237,226,.74);
  border-bottom:1px solid rgba(166,132,101,.15);
  backdrop-filter:blur(18px);
}
.breadcrumb{font-size:13px;color:#7b7c73}
.iconbtn,.btn{
  border-radius:14px;
}
.iconbtn{background:rgba(255,250,243,.86);border-color:rgba(161,126,96,.2);box-shadow:0 6px 18px rgba(46,34,24,.06)}
.btn{
  background:rgba(255,251,245,.85);
  border-color:rgba(159,127,101,.18);
  color:#32403d;
  box-shadow:0 8px 18px rgba(54,40,27,.04);
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.btn:hover{background:#fffdf9;transform:translateY(-1px);box-shadow:0 12px 22px rgba(54,40,27,.08)}
.btn-primary{
  background:linear-gradient(135deg,#d17c59 0%, #bc6643 100%);
  border-color:transparent;color:#fff;box-shadow:0 14px 26px rgba(188,102,67,.24)
}
.btn-primary:hover{background:linear-gradient(135deg,#cf7956 0%, #ac5738 100%);border-color:transparent}
.btn-soft{background:#f6e5db;border-color:#f2d3c3;color:#a35135}
.card{
  background:linear-gradient(180deg, rgba(255,251,245,.98) 0%, rgba(255,248,240,.98) 100%);
  border:1px solid rgba(160,132,106,.15);
  border-radius:24px;
  box-shadow:0 10px 30px rgba(40,32,22,.05);
}
.card:hover{box-shadow:0 18px 36px rgba(40,32,22,.07)}
.heading h1{font-size:44px;margin-bottom:6px}
.heading p{font-size:15px;max-width:680px;color:#6c756f}
.hero{
  background:
    radial-gradient(circle at top left, rgba(233,169,133,.22), transparent 28%),
    radial-gradient(circle at 80% 15%, rgba(90,139,124,.16), transparent 24%),
    linear-gradient(135deg,#15302d 0%, #254741 52%, #3c5b54 100%);
  border-radius:34px;
  box-shadow:0 26px 60px rgba(22,40,37,.18);
  border:1px solid rgba(255,255,255,.08);
  min-height:272px;
  padding:42px 42px;
}
.hero:before{right:16%;top:-105px;border-color:#ffffff24}
.hero:after{right:-100px;bottom:-210px;border-color:#ffffff0f}
.hero .eyebrow{
  display:inline-flex;background:rgba(255,255,255,.08);padding:10px 14px;border-radius:999px;color:#f1bf9f;backdrop-filter:blur(6px)
}
.hero h1{font-size:clamp(34px,4vw,58px);line-height:1.02;max-width:760px}
.hero p{color:#d3e0db;font-size:15px;max-width:520px}
.hero .btn-secondary{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.15);color:#f1f5f1}
.hero .btn-secondary:hover{background:rgba(255,255,255,.12)}
.art-square{background:#db916a;border-color:#f5ccb2;box-shadow:16px 18px 0 rgba(184,100,76,.45)}
.cards4{gap:16px}
.metric{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,#fffdf9 0%, #fff8ef 100%);
  border-radius:22px;
  padding:22px;
}
.metric:before{content:"";position:absolute;inset:auto -28px -28px auto;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle, rgba(206,118,82,.09), transparent 68%)}
.metric .iconwrap{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#f8ecdf,#f3ddcf);color:#92563d;box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.metric .amount{font-size:34px;line-height:1.08}
.metric .desc{font-size:12px;color:#69746e}
.quick{background:linear-gradient(180deg,#fffefb,#fff7ef);border-radius:18px;padding:17px 16px;font-weight:700}
.quick:hover{border-color:#e5b49e;background:#fff9f2;transform:translateY(-1px)}
.quick svg{color:#b55f3e}
.summarypanel{background:linear-gradient(180deg,#fff9f1 0%, #fff6ec 100%);border-color:#ebdbc8;border-radius:18px}
.tag{background:#f0e9df;color:#53605c;border:1px solid #e6dacb}
.tag.ok{background:#e0efe8;color:#2f7a68;border-color:#cfe6dc}
.notice{background:#f4ede4;color:#6f746f;border:1px solid #e7dbcb}
.notice.warn{background:#faeee3;border-color:#f1d1b9;color:#955a35}
.notice.good{background:#e5f1eb;border-color:#d2e7de;color:#2f7a68}
.productcard{border-radius:24px;background:linear-gradient(180deg,#fffdf8 0%,#fff7ee 100%)}
.productcard .pico{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#f9ebe1,#f4d9ca);color:#b55f3e;box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.productcard h3{font-size:21px}
.record-link{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:0;color:#2f3a38;font-weight:750;cursor:pointer;text-align:left}
.record-link:hover{color:#b05b3a}
.record-arrow{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:999px;background:#f3e3d8;color:#a35637;font-size:12px;line-height:1}
.clickrow{cursor:pointer;transition:background .15s ease, transform .15s ease}
.clickrow:hover{background:rgba(201,110,75,.05)}
tr.clickrow:hover td{background:rgba(201,110,75,.04)}
th{background:rgba(255,250,244,.85);color:#8b8f87}
td,th{border-bottom-color:#efe4d7}
input,select,textarea{
  background:rgba(255,255,255,.78);
  border-color:#decdbd;
  border-radius:14px;
  padding:12px 13px;
}
input:focus,select:focus,textarea:focus{border-color:#c96e4b;outline:3px solid rgba(201,110,75,.12)}
.modal-shade{background:rgba(24,27,24,.55);backdrop-filter:blur(6px)}
.modal{
  background:linear-gradient(180deg,#fffaf4 0%, #fff5eb 100%);
  border:1px solid rgba(168,134,104,.16);
  border-radius:28px;box-shadow:0 28px 90px rgba(23,25,22,.28)
}
.detail-stat,.detail-line{background:rgba(255,255,255,.55);border:1px solid rgba(165,134,104,.1);border-radius:16px}
.detail-stat{padding:16px}
.detail-line{padding:13px 14px;margin-bottom:10px}
.toast{background:#203430;border:1px solid rgba(255,255,255,.08);border-radius:15px}
.footer{color:#8d8c83}
.mobile-nav{background:rgba(20,35,33,.96);backdrop-filter:blur(10px);box-shadow:0 -10px 30px rgba(22,28,25,.16)}
.mobile-nav .navbutton{color:#d6e0db;border-radius:12px}
.mobile-nav .navbutton.active{background:rgba(201,110,75,.16);box-shadow:none}
@media(max-width:1180px){.heading h1{font-size:40px}.hero{padding:36px 34px;min-height:250px}.hero h1{font-size:44px}}
@media(max-width:760px){
  html,body{background:linear-gradient(180deg,#f4ede2 0%, #eee6d9 100%)}
  .top{background:rgba(244,237,226,.9)}
  .heading h1{font-size:36px}
  .hero{padding:30px 24px;border-radius:28px;min-height:0}
  .hero h1{font-size:36px}
  .metric .amount{font-size:29px}
  .card,.productcard{border-radius:22px}
}


/* Fixed two-column shell: sidebar and sticky header must retain their original positioning. */
.sidebar{position:fixed;inset:0 auto 0 0;z-index:5;width:262px}
.work{margin-left:262px;width:calc(100% - 262px);min-width:0;position:relative}
.top{position:sticky;top:0;z-index:4}
.app{display:block;min-height:100vh}
.hero h1{font-size:clamp(30px,3.3vw,47px);line-height:1.07}
.hero-inner{min-width:0;flex:1;max-width:680px}
.hero-art{flex-shrink:0;margin-left:24px}
.category-strip{margin:0 0 24px;padding:22px 23px 23px;border:1px solid rgba(168,135,105,.17);border-radius:24px;background:rgba(255,250,243,.72);box-shadow:0 12px 35px rgba(45,34,22,.045)}
.category-strip h2{font-size:24px;margin:0}
.category-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.category-tile{appearance:none;position:relative;display:flex;min-width:0;min-height:147px;flex-direction:column;gap:7px;text-align:left;border:1px solid rgba(145,117,96,.14);border-radius:18px;padding:16px 15px;background:#f7e7db;color:#253933;transition:transform .18s,box-shadow .18s,border-color .18s}
.category-tile:hover{transform:translateY(-3px);box-shadow:0 14px 24px rgba(68,47,31,.11);border-color:#d8a48a}
.category-tile:focus-visible{outline:3px solid #d48e6b;outline-offset:3px}
.category-tile.category-1{background:#e7ece3}.category-tile.category-2{background:#f3e5d3}.category-tile.category-3{background:#ebdfd8}
.category-tile strong{font-size:15px;letter-spacing:-.02em}.category-tile small{font-size:11px;color:#656b62;line-height:1.45;max-width:225px}
.tile-monogram{display:block;font-family:Georgia,serif;font-size:28px;line-height:1;margin-bottom:4px;color:#bf7153}
.category-1 .tile-monogram{color:#547b63}.category-2 .tile-monogram{color:#b88944}.category-3 .tile-monogram{color:#8e6a60}
.tile-arrow{position:absolute;right:12px;top:13px;font-size:18px;color:#ad704f}
.recipe-settings{display:grid;grid-template-columns:1fr 1.25fr .7fr;gap:14px;margin-top:14px}
.recipe-hint{background:#e8efe9;color:#3d6a59;border-radius:12px;padding:11px 15px;margin-top:14px;font-size:12px;line-height:1.5}
.itemrow.recipe{grid-template-columns:minmax(160px,2fr) minmax(105px,.9fr) minmax(90px,.85fr) 42px}
@media(max-width:1180px){.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-art{flex-basis:160px;width:160px}}
@media(max-width:760px){.sidebar{display:none}.work{margin:0;width:100%}.top{position:sticky;top:0}.category-strip{padding:16px}.category-grid{gap:9px}.category-tile{min-height:148px;padding:12px}.category-tile strong{font-size:13px}.category-tile small{font-size:10px}.recipe-settings{grid-template-columns:repeat(2,minmax(0,1fr))}.recipe-settings .field:first-child{grid-column:1/-1}.itemrow.recipe{grid-template-columns:repeat(2,minmax(0,1fr))}.itemrow.recipe .field:first-child{grid-column:1/-1}.itemrow.recipe .remove{grid-column:2;justify-self:end}.hero-art{display:none}.hero h1{font-size:clamp(29px,8vw,37px)}}

.recipe-preview{margin-top:20px;padding:20px;border:1px solid #dfd0bf;border-radius:18px;background:linear-gradient(160deg,#f5f0e6,#fff9f1)}

.production-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:20px}
.stock-metric{padding:22px 24px;display:grid;align-content:center;gap:9px}
.stock-metric strong{font-family:ui-serif,Georgia,serif;font-size:29px;color:var(--ink);font-weight:700}
.batch-lines{display:grid;gap:8px}.batch-line{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.62)}

@media(max-width:760px){.production-stats{grid-template-columns:1fr 1fr;gap:10px}.stock-metric{padding:14px 16px}.stock-metric strong{font-size:22px}.mobile-nav button span{font-size:9px;white-space:nowrap;letter-spacing:-.25px}.mobile-nav{padding-left:0;padding-right:0}}
@media(max-width:400px){.production-stats{grid-template-columns:1fr}.stock-metric{display:flex;align-items:center;justify-content:space-between}.mobile-nav button span{font-size:8px}}

/* Релиз 8: продажи и возвраты */
.sales-overview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:20px}
.sales-overview-item{padding:20px 24px;text-align:left;display:flex;flex-direction:column;gap:8px;cursor:pointer;color:var(--ink);border-radius:19px}
.sales-overview-item:hover{border-color:#d6a98a;transform:translateY(-2px)}
.sales-overview-item strong{font-family:Georgia,serif;font-size:29px;line-height:1.15}
.sales-stats .stock-metric strong.loss{color:var(--red)}
#saleForm .formgrid{margin-top:16px}
#saleReturnForm label:has(input[type=checkbox]){display:flex;align-items:center;line-height:1.5;cursor:pointer;font-size:13px}
@media(max-width:760px){.sales-overview{gap:10px}.sales-overview-item{padding:15px}.sales-overview-item strong{font-size:23px}}
@media(max-width:410px){.sales-overview-item strong{font-size:21px}}

<script>

const icoPaths={house:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M2 3h2l2.4 12.3A2 2 0 0 0 8.4 17H20l2-10H5"/>',package:'<path d="m12 2 9 5-9 5-9-5 9-5ZM3 7v10l9 5 9-5V7M12 12v10"/>',shapes:'<rect x="3" y="3" width="9" height="9" rx="2"/><circle cx="17" cy="7" r="4"/><path d="m9 15 6 7H3z"/>',calc:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h2m4 0h2M8 16h2m4 0h2"/>',gear:'<path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="M19.4 15a1.8 1.8 0 0 0 .36 1.99l-1.77 1.77a1.8 1.8 0 0 0-1.99-.36 1.8 1.8 0 0 0-1 1.65V22h-2.5v-1.95a1.8 1.8 0 0 0-1-1.65 1.8 1.8 0 0 0-1.99.36l-1.77-1.77a1.8 1.8 0 0 0 .36-1.99 1.8 1.8 0 0 0-1.65-1H4v-2.5h1.95a1.8 1.8 0 0 0 1.65-1 1.8 1.8 0 0 0-.36-1.99l1.77-1.77a1.8 1.8 0 0 0 1.99.36 1.8 1.8 0 0 0 1-1.65V3h2.5v1.95a1.8 1.8 0 0 0 1 1.65 1.8 1.8 0 0 0 1.99-.36l1.77 1.77a1.8 1.8 0 0 0-.36 1.99 1.8 1.8 0 0 0 1.65 1H22v2.5h-1.95a1.8 1.8 0 0 0-1.65 1Z" transform="translate(-1 -1) scale(.94)"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="m5 12 14 0m-6-6 6 6-6 6"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6m5 4v7m4-7v7"/>',edit:'<path d="m16 3 5 5L9 20H4v-5L16 3Zm-2 2 5 5"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>',upload:'<path d="M12 21V9m-4 4 4-4 4 4M4 7V3h16v4"/>',layers:'<path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',chart:'<path d="M3 3v18h18M7 16v-3m5 3V8m5 8V6"/>',check:'<path d="m4 12 5 5L20 6"/>',alert:'<circle cx="12" cy="12" r="10"/><path d="M12 7v6m0 4h.01"/>',file:'<path d="M6 2h9l5 5v15H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm9 0v6h5M8 12h8M8 16h8"/>',spark:'<path d="m12 2 2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2L12 2Z"/>',bag:'<path d="M4 8h16l-1 13H5L4 8Zm4 0V6a4 4 0 0 1 8 0v2"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v6m0-10h.01"/>'};
function icon(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icoPaths[name]||icoPaths.package}</svg>`}
const navs=[['dashboard','Главная','house'],['purchases','Закупки','cart'],['materials','Материалы','package'],['products','Изделия','shapes'],['production','Производство','layers'],['calculator','Калькуляции','calc'],['sales','Продажи','bag']];
const INITIAL_MATERIAL_CATEGORIES=['Эфирные масла','Базовые масла','Косметические ингредиенты','Воск','Фитили','Отдушки','Красители','Наполнители','Ткань','Упаковка','Тара','Бумага','Фурнитура'];
const categoryKey=value=>String(value??'').trim().replace(/\s+/g,' ').toLocaleLowerCase('ru-RU');
function normalizedCategory(value){return String(value??'').trim().replace(/\s+/g,' ')}
function categoriesFromState(data){return (data.materialCategories||[]).slice().sort((a,b)=>a.localeCompare(b,'ru'))}
function initializeCategories(data){
  const input=Array.isArray(data.materialCategories)?data.materialCategories:INITIAL_MATERIAL_CATEGORIES;
  const names=new Map();
  [...input,...data.materials.map(m=>m.category)].forEach(v=>{
    if(typeof v!=='string')return;
    const name=normalizedCategory(v);
    if(name&&name.length<=80&&!names.has(categoryKey(name)))names.set(categoryKey(name),name);
  });
  data.materialCategories=[...names.values()];
  if(!Array.isArray(data.productionBatches))data.productionBatches=[];
  if(!Array.isArray(data.sales))data.sales=[];
  if(!Array.isArray(data.saleReturns))data.saleReturns=[];
  // Названия в уже существующих материалах не должны расходиться с реестром.
  data.materials.forEach(m=>{if(m.category)m.category=names.get(categoryKey(m.category))||m.category});
  return data;
}
function canonicalCategory(name){const normalized=normalizedCategory(name);return state.materialCategories.find(v=>categoryKey(v)===categoryKey(normalized))||normalized}
function registerCategory(name){
  const normalized=normalizedCategory(name);
  if(!normalized)return '';
  const previous=state.materialCategories.find(v=>categoryKey(v)===categoryKey(normalized));
  if(previous)return previous;
  state.materialCategories.push(normalized);
  return normalized;
}
function categoryCount(name){return state.materials.filter(m=>categoryKey(m.category)===categoryKey(name)).length}
function materialCountText(count){return `${count} ${count%10===1&&count%100!==11?'материал':count%10>=2&&count%10<=4&&(count%100<12||count%100>14)?'материала':'материалов'}`}
const emptyState=()=>({schemaVersion:1,materials:[],purchases:[],products:[],calculations:[],materialCategories:[...INITIAL_MATERIAL_CATEGORIES],productionBatches:[],sales:[],saleReturns:[]});
const STORAGE_KEY='masterskaya-prototype-v1';
let persisted=true;
function readState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(s&&Array.isArray(s.materials)&&Array.isArray(s.purchases)&&Array.isArray(s.products)&&Array.isArray(s.calculations))return initializeCategories(s);}catch(e){persisted=false;}return emptyState()}
let materialCategoryFilter='',state=readState(),productionSelected='',view='dashboard',editingPurchaseId=null,purchaseEditing=false,purchaseDraft=null,productEditing=null,productDraft=null,calcSelected='',calcDraft={planned:50,good:50,setup:0,other:0,sale:150,fee:0,target:30},toastTimer;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));persisted=true}catch(e){persisted=false;toast('Браузер не смог сохранить данные. Экспортируйте резервную копию.','error')}updatePersistIndicator();return persisted}

function n(v){let a=Number(String(v??0).replace(',','.'));return Number.isFinite(a)?a:0}
function positive(v){return Math.max(0,n(v))}
function r(v,d=2){return new Intl.NumberFormat('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:d}).format(v||0)}

const CATEGORY_PRESETS=[
 {name:'Ароматерапия · смеси',unit:'флакон',desc:'Эфирные масла — в каплях или мл, основа — в мл, тара — поштучно.'},
 {name:'Косметика',unit:'баночка',desc:'Масла, активы, эмульгаторы, тара и упаковка. Расход компонентов — в г или мл.'},
 {name:'Саше',unit:'саше',desc:'Наполнитель, ткань, аромакомпоненты, мешочек и упаковка.'},
 {name:'Свечи',unit:'свеча',desc:'Воск, фитиль, аромат, краситель, ёмкость и упаковка.'},
 {name:'Полиграфия',unit:'шт.',desc:'Бумага, печать, резка, упаковка.'},

const DIRECTION_RULES=[
 {name:'Свечи',rx:/свеч|воск(?:овая|овые|овой)?|wax\s*melt/i},
 {name:'Саше',rx:/саше|аромамешоч|сухоцветн(?:ый|ое)|попурри/i},
 {name:'Косметика',rx:/крем|бальзам|сыворотк|маск[аиу]|скраб|лосьон|шампун|мыло|помад|гель\s+для|баттер|косметическ/i},
 {name:'Ароматерапия · смеси',rx:/аромасмес|эфирн|аромадиффузор|диффузор|аромароллер|аромаролл|аромамасл|ингалятор|аромаспрей|масляная смесь/i},

const TEMPLATES={
 'Свечи':[{label:'Воск / основа',match:/воск|wax|парафин|стеарин/i},{label:'Фитиль',match:/фитил/i},{label:'Аромат',match:/отдуш|эфирн|ароматизатор|аромакомп/i},{label:'Краситель (по желанию)',match:/красител|пигмент/i},{label:'Ёмкость',match:/баноч|стакан|подсвечник|стекло|тара/i}],
 'Саше':[{label:'Наполнитель',match:/наполнител|лаванд|сухоцвет|трав|лепест|стружк/i},{label:'Ткань / мешочек',match:/ткан|мешоч|органз|хлопок|лён|лен/i},{label:'Аромат',match:/эфирн|аромат|отдуш/i},{label:'Упаковка',match:/упаков|этикет|бирк/i}],
 'Ароматерапия · смеси':[{label:'Эфирные масла',match:/эфирн|essential/i},{label:'Основа / растворитель',match:/базов|носител|основ|спирт|солюбилизатор/i},{label:'Флакон',match:/флакон|пипетк|капельниц|роллер|тара/i}],
 'Косметика':[{label:'Масляная фаза',match:/базов|растительн.*масл|баттер|воск/i},{label:'Водная фаза / гидролат',match:/гидролат|вод[аы]|вода|водная/i},{label:'Эмульгатор / компонент',match:/эмульгатор|актив|консервант|косметическ/i},{label:'Тара',match:/баноч|флакон|туб|тара/i}],

 'Текстиль':[{label:'Ткань',match:/ткан|хлопок|лен|лён/i},{label:'Нити',match:/нит|пряж|мулин/i},{label:'Фурнитура',match:/фурнитур|пуговиц|молни|застёж/i}]

function proposedDirection(name){const text=String(name||'').trim();if(!text)return '';return DIRECTION_RULES.find(rule=>rule.rx.test(text))?.name||''}
function directionPreset(name){return CATEGORY_PRESETS.find(c=>categoryKey(c.name)===categoryKey(name))}
function productDirections(){const map=new Map();state.products.forEach(p=>{const c=normalizedCategory(p.category);if(c&&!map.has(categoryKey(c)))map.set(categoryKey(c),c)});return Array.from(map.values()).sort((a,b)=>a.localeCompare(b,'ru'))}
function directionHelp(name){return directionPreset(name)?.desc||'Состав, единицы измерения и время работы задаются для каждого изделия отдельно.'}
function productSuggestionMarkup(name,category){const guess=proposedDirection(name);if(!name.trim())return '<span class="muted">Введите название — подскажем направление.</span>';
 if(!guess)return '<span class="muted">Не удалось определить автоматически. Введите своё направление: оно появится на главной после сохранения.</span>';
 if(categoryKey(category)===categoryKey(guess))return '<span class="suggestion-ok">✓ Направление выбрано: '+esc(guess)+'</span>';

}
function renderDirectionSuggestion(){const f=document.getElementById('productForm'),target=document.getElementById('directionSuggestion');if(!f||!target)return;target.innerHTML=productSuggestionMarkup(f.elements.namedItem('name').value,f.elements.namedItem('category').value);const hint=document.getElementById('recipeHint');if(hint)hint.textContent=directionHelp(f.elements.namedItem('category').value);const roles=document.getElementById('templateRoles');if(roles)roles.innerHTML=templateRolesMarkup(f.elements.namedItem('category').value)}
function templateRolesMarkup(name){const roles=TEMPLATES[name];if(!roles)return '<span class="small">Состав формируется вручную. Можно использовать любые материалы из справочника.</span>';
 const matched=roles.filter(role=>state.materials.some(m=>role.match.test(m.name+' '+(m.category||'')))).length;
 return `<div class="template-roles">${roles.map(role=>`<span class="template-role">${esc(role.label)}</span>`).join('')}</div><p class="small" style="margin:12px 0">Найдено подходящих типов материалов: ${matched} из ${roles.length}. Количество каждого ингредиента указываешь сам.</p><button type="button" class="btn btn-small" data-action="apply-template">${icon('plus',15)} Подобрать материалы из каталога</button>`}
function applyTemplate(){const form=document.getElementById('productForm');if(!form)return;const category=form.elements.namedItem('category').value,roles=TEMPLATES[category];if(!roles){toast('Для этого направления пока нет шаблона. Материалы можно добавить вручную.');return}
 captureProduct();const original=productDraft.recipe||[],used=new Set(original.map(r=>r.materialId));let added=0;
 for(const role of roles){const m=state.materials.find(m=>!used.has(m.id)&&role.match.test(m.name+' '+(m.category||'')));if(!m)continue;original.push({materialId:m.id,qty:'',measure:category==='Ароматерапия · смеси'&&/эфирн/i.test(role.label)&&m.unit==='мл'?'drops':'base'});used.add(m.id);added++}
 productDraft.recipe=original;render();document.getElementById('productForm')?.scrollIntoView({block:'start'});toast(added?`Добавлено материалов: ${added}. Укажи фактический расход для каждого.`:'Подходящих материалов пока нет. Добавь их в «Материалы» или выбери вручную.');}
function directionProductsModal(name){const matches=state.products.filter(p=>categoryKey(p.category)===categoryKey(name));return `<div class="modal-shade" data-backdrop><div class="modal modal-wide" role="dialog" aria-modal="true" aria-label="Направление ${esc(name)}"><div class="modal-head"><div><div class="overline">Направление производства</div><h2>${esc(name)}</h2><p class="small">${matches.length} ${matches.length===1?'изделие':matches.length%10>=2&&matches.length%10<=4&&(matches.length%100<12||matches.length%100>14)?'изделия':'изделий'}</p></div><button class="iconbtn" data-action="close-modal" aria-label="Закрыть">${icon('x')}</button></div><div class="direction-detail-list">${matches.length?matches.map(p=>`<div class="direction-product-row"><button class="record-link" data-action="view-product" data-id="${esc(p.id)}">${esc(p.name)} ↗</button><span class="small">${p.recipe.length} ингредиентов</span></div>`).join(''):'<div class="notice">В этом направлении пока нет изделий.</div>'}</div><div class="detail-actions"><button class="btn btn-primary" data-action="new-product-category" data-cat="${esc(name)}" data-unit="${esc(directionPreset(name)?.unit||'шт.')}">${icon('plus',16)} Новое изделие</button><button class="btn" data-action="close-modal">Закрыть</button></div></div></div>`}

function dropsFactor(material){const v=n(material?.dropsPerMl);return v>0?v:30}
function recipeMeasureOptions(material,selected='base',product=null){
  if(!material)return '<option value="base">ед.</option>';
  const u=material.unit,hasPct=['г','кг','мл','л'].includes(u);
  return `<option value="base" ${!['drops','percent'].includes(selected)?'selected':''}>${esc(u)}</option>`+
    (u==='мл'?`<option value="drops" ${selected==='drops'?'selected':''}>кап.</option>`:'')+
    (hasPct?`<option value="percent" ${selected==='percent'?'selected':''}>% от массы / объёма изделия</option>`:'')+
    (selected==='percent'&&!hasPct?'<option value="percent" selected>Некорректный %</option>':'');
}
function unitFactor(u){return {г:1,кг:1000,мл:1,л:1000}[u]||null}
function unitDimension(u){return ['г','кг'].includes(u)?'mass':['мл','л'].includes(u)?'volume':null}
function recipeUsage(line,product){
  const material=byId(line.materialId);
  if(!material)return {error:'Материал не найден'};
  const q=n(line.qty),mode=line.measure||'base';
  if(!Number.isFinite(q)||q<=0)return {error:'Введите положительный расход для «'+material.name+'»'};
  if(mode==='drops'){
    if(material.unit!=='мл')return {error:'Капли доступны только для материалов в мл: '+material.name};
    return {qty:q/dropsFactor(material),unit:'мл',displayQty:q,displayUnit:'кап.'};
  }
  if(mode==='percent'){
    const total=n(product.outputValue),outputUnit=product.outputUnit||'мл';
    if(!(total>0))return {error:'Для процентов укажите объём или массу одного готового изделия'};
    if(!unitDimension(material.unit)||unitDimension(material.unit)!==unitDimension(outputUnit))return {error:'Проценты для «'+material.name+'» требуют одинакового типа единиц (г/кг либо мл/л). Плотность не задана'};
    if(q>100)return {error:'Процент «'+material.name+'» не может быть больше 100%'};
    const qty=total*unitFactor(outputUnit)*q/100/unitFactor(material.unit);
    return {qty,unit:material.unit,displayQty:qty,displayUnit:material.unit};
  }
  return {qty:q,unit:material.unit,displayQty:q,displayUnit:material.unit};
}
function recipeUse(line,product){const v=recipeUsage(line,product);return v.error?NaN:v.qty}
function recipeValidation(product){
  let percentSum=0,hasPercent=false;
  for(const line of product.recipe||[]){
    const usage=recipeUsage(line,product);
    if(usage.error)return {error:usage.error};
    if(line.measure==='percent'){hasPercent=true;percentSum+=n(line.qty)};
  }
  if(percentSum>100.000001)return {error:'Сумма процентных компонентов выше 100%: '+r(percentSum,3)+'%'};
  return {percentSum,hasPercent,warning:hasPercent&&percentSum<99.999999?'Процентные компоненты составляют '+r(percentSum,3)+'%. Проверьте полноту рецептуры.':''};
}
function recipeBreakdown(product,count=1){
  const check=recipeValidation(product);if(check.error)return {error:check.error};
  const lines=[];let cost=0;let missing=[];
  for(const line of product.recipe||[]){
    const mat=byId(line.materialId),usage=recipeUsage(line,product),price=costOf(line.materialId),quantity=usage.qty*count;
    const lineCost=price===null?null:price*quantity;
    if(price===null)missing.push(mat?.name||'Материал не найден');else cost+=lineCost;
    lines.push({name:mat?.name||'Материал не найден',quantity,unit:usage.unit,cost:lineCost,mode:line.measure||'base',share:n(line.qty),drops:line.measure==='drops'?n(line.qty)*count:null});
  }
  return {cost,lines,missing,warning:check.warning,percentSum:check.percentSum};
}
function recipeLabel(line,product){const mat=byId(line.materialId);return `${r(line.qty,3)} ${line.measure==='percent'?'%':line.measure==='drops'&&mat?.unit==='мл'?'кап.':mat?.unit||'ед.'}`}
function productUnit(p){return p?.productUnit||'шт.'}
function categoryCardsMarkup(){const all=productDirections(),isStart=!all.length;const list=isStart?CATEGORY_PRESETS.slice(0,4).map(c=>c.name):all;return `<section class="category-strip"><div class="directions-header"><div><div class="subhead">${isStart?'Возможности мастерской':'Направления из вашего каталога'}</div><h2>${isStart?'С чего начнём?':'Ваши направления'}</h2><p class="small" style="margin:6px 0 0">${isStart?'Это примеры. Создай любое изделие — направление появится автоматически.':'Здесь только направления сохранённых изделий. Нажми на плитку, чтобы открыть состав каталога.'}</p></div><button class="btn btn-small" data-action="new-product">${icon('plus',15)} Новое изделие</button></div><div class="category-grid">${list.map((name,i)=>{const c=directionPreset(name),count=state.products.filter(p=>categoryKey(p.category)===categoryKey(name)).length;return `<button class="category-tile category-${i%4}" data-action="${isStart?'new-product-category':'view-direction'}" data-cat="${esc(name)}" data-unit="${esc(c?.unit||'шт.')}"><span class="tile-monogram">${['✦','◈','❋','◌'][i%4]}</span><strong>${esc(name)}</strong><small>${isStart?esc(c?.desc||'Создать изделие'):count+' '+(count===1?'изделие':count<5?'изделия':'изделий')+' · открыть'}</small><span class="tile-arrow">↗</span></button>`}).join('')}</div>${!isStart?'<p class="small direction-tip">Нет нужного направления? Создай изделие и укажи своё название категории — она появится здесь.</p>':''}</section>`}

function sums(purchases=state.purchases){const s={};state.materials.forEach(m=>s[m.id]={qty:0,spent:0});purchases.forEach(p=>{let rows=p.lines||[],raw=rows.map(x=>positive(x.packs)*positive(x.price)),sum=raw.reduce((a,b)=>a+b,0);rows.forEach((line,i)=>{const item=s[line.materialId];if(!item)return;let qty=positive(line.packs)*positive(line.packSize);let alloc=(sum>0?raw[i]/sum:1/Math.max(1,rows.length))*positive(p.delivery);item.qty+=qty;item.spent+=raw[i]+alloc;});});return s}
function costOf(id){const v=sums()[id];return v&&v.qty>0?v.spent/v.qty:null}
function purchasedTotal(p){return (p.lines||[]).reduce((acc,x)=>acc+positive(x.packs)*positive(x.price),0)+positive(p.delivery)}
function stockFor(purchases=state.purchases,batches=state.productionBatches){
 const receipts=sums(purchases),used={};
 (batches||[]).filter(b=>!b.cancelledAt).forEach(b=>(b.recipeSnapshot||[]).forEach(line=>{if(line.materialId)used[line.materialId]=(used[line.materialId]||0)+positive(line.quantity)}));
 const out={};state.materials.forEach(m=>{const got=receipts[m.id]||{qty:0,spent:0},spent=used[m.id]||0,remaining=got.qty-spent,unitCost=got.qty>0?got.spent/got.qty:null;
 out[m.id]={received:got.qty,used:spent,available:Math.abs(remaining)<1e-8?0:remaining,unitCost,value:Math.max(0,remaining)*(unitCost||0)};
 });return out;
}
function stockCheckForPurchases(purchases){const stock=stockFor(purchases);return state.materials.find(m=>(stock[m.id]?.available||0)<-1e-7)?.name||''}
/* Продажи и возвраты: ФИФО готовых партий; записи неизменяемые. */
function salesLots(){
 const lots=new Map();
 (state.productionBatches||[]).filter(b=>!b.cancelledAt).forEach(b=>lots.set(b.id,{batchId:b.id,productId:b.productId,productName:b.productName,date:b.date,createdAt:b.createdAt||'',produced:b.good,qty:b.good,unitCost:b.unitCost}));
 (state.sales||[]).forEach(s=>(s.allocations||[]).forEach(a=>{const l=lots.get(a.batchId);if(l)l.qty-=a.qty}));
 (state.saleReturns||[]).filter(t=>t.restock).forEach(t=>(t.allocations||[]).forEach(a=>{const l=lots.get(a.batchId);if(l)l.qty+=a.qty}));
 return [...lots.values()].sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt)||a.batchId.localeCompare(b.batchId));
}
function remainingFinished(id){const lots=salesLots().filter(l=>!id||l.productId===id);return {qty:lots.reduce((a,l)=>a+l.qty,0),value:lots.reduce((a,l)=>a+l.qty*l.unitCost,0),lots}}
function allocateSale(productId,quantity,date){
 let rest=quantity;const allocations=[];
 for(const lot of salesLots().filter(l=>l.productId===productId&&l.qty>0&&l.date<=date)){
   if(rest<=0)break;const qty=Math.min(rest,lot.qty);allocations.push({batchId:lot.batchId,qty,unitCost:lot.unitCost,cost:qty*lot.unitCost});rest-=qty;
 }
 if(rest>0)return {error:'Недостаточно готовых изделий на выбранную дату. Проверьте остаток и дату выпуска.'};
 return {allocations,cogs:allocations.reduce((a,l)=>a+l.cost,0)};
}
function salesTotal(s){const amount=s.quantity*s.unitPrice;return {amount,commission:amount*s.commissionPct/100+s.fixedFee,shipping:s.shipping,expense:amount*s.commissionPct/100+s.fixedFee+s.shipping}}
function salesReport(){
 const sales=state.sales||[],returned=state.saleReturns||[];
 const gross=sales.reduce((n,s)=>n+s.quantity*s.unitPrice,0);
 const refunds=returned.reduce((n,t)=>n+t.refund,0);
 const cost=sales.reduce((n,s)=>n+s.cogs,0)-returned.filter(t=>t.restock).reduce((n,t)=>n+(t.cogs||0),0);
 const fees=sales.reduce((n,s)=>n+salesTotal(s).commission,0);
 const shipping=sales.reduce((n,s)=>n+s.shipping,0);
 const returnsCost=returned.reduce((n,t)=>n+t.extraCost,0);
 return {gross,refunds,revenue:gross-refunds,cost,fees,shipping,returnsCost,profit:gross-refunds-cost-fees-shipping-returnsCost,qty:sales.reduce((a,s)=>a+s.quantity,0),returnedQty:returned.reduce((a,t)=>a+t.quantity,0),operations:sales.length};
}
function goodDate(v){return /^\d{4}-\d\d-\d\d$/.test(v)&&Number.isFinite(Date.parse(v))&&new Date(v+'T12:00:00').getDate()===Number(v.slice(8,10))&&v<=todayLocal()}
function safeMoney(v){return v!==''&&Number.isFinite(Number(v))&&Number(v)>=0&&Number(v)<=1e12}
function buildSale(v){
 const p=byProduct(v.productId);
 if(!p)return {error:'Выберите изделие.'};
 if(!goodDate(v.date))return {error:'Введите действительную дату продажи, не позднее сегодняшней.'};
 if(!Number.isInteger(v.quantity)||v.quantity<1||v.quantity>100000)return {error:'Количество продажи должно быть целым числом от 1 до 100 000.'};
 if(![v.unitPrice,v.commissionPct,v.fixedFee,v.shipping].every(safeMoney)||v.commissionPct>100)return {error:'Проверьте цену продажи, комиссию и доставку. Все значения должны быть неотрицательными; процент комиссии — не выше 100.'};
 const allocation=allocateSale(p.id,v.quantity,v.date);if(allocation.error)return allocation;
 const raw={id:uid(),createdAt:new Date().toISOString(),date:v.date,productId:p.id,productName:p.name,productUnit:productUnit(p),quantity:v.quantity,unitPrice:v.unitPrice,commissionPct:v.commissionPct,fixedFee:v.fixedFee,shipping:v.shipping,channel:(v.channel||'').trim().slice(0,100),note:(v.note||'').trim().slice(0,200),...allocation};
 return {...raw,total:salesTotal(raw).amount,profit:salesTotal(raw).amount-allocation.cogs-salesTotal(raw).expense};
}
function saleInputs(){const f=document.getElementById('saleForm');if(!f)return null;const v=f.elements;return {productId:v.namedItem('productId').value,date:v.namedItem('date').value,quantity:Number(v.namedItem('quantity').value),unitPrice:Number(v.namedItem('unitPrice').value),commissionPct:Number(v.namedItem('commissionPct').value),fixedFee:Number(v.namedItem('fixedFee').value),shipping:Number(v.namedItem('shipping').value),channel:v.namedItem('channel').value,note:v.namedItem('note').value}}
function salePreview(v){const sale=buildSale(v);if(sale.error)return `<div class="notice warn">${esc(sale.error)}</div>`;const val=salesTotal(sale);return `<div class="subhead">Прогноз операции</div><div class="bigprice num">${rub(sale.profit)}</div><div class="small">Прибыль до налогов и прочих неучтённых расходов</div><hr class="hr"><div class="sumrow"><span>Выручка</span><strong>${rub(val.amount)}</strong></div><div class="sumrow"><span>Себестоимость (ФИФО)</span><strong>− ${rub(sale.cogs)}</strong></div><div class="sumrow"><span>Комиссии</span><strong>− ${rub(val.commission)}</strong></div><div class="sumrow"><span>Доставка продавца</span><strong>− ${rub(r.shipping)}</strong></div><div class="notice" style="margin-top:12px">Списание готовых товаров: ${sale.allocations.length? sale.allocations.map(a=>r(a.qty)+' шт. · '+rub(a.cost)).join(', '):'—'}</div>`}
function refreshSalePreview(){const target=document.getElementById('salePreview');if(target)target.innerHTML=salePreview(saleInputs())}
function saleForm(){const products=state.products.filter(p=>remainingFinished(p.id).qty>0);return `<form id="saleForm" class="card cardpad"><div class="sectionline"><h2>Новая продажа</h2><span class="tag">Готовая продукция</span></div>${!products.length?'<div class="notice warn">На складе нет готовых изделий. Сначала оформите выпуск в разделе «Производство».</div>':''}<div class="formgrid"><div class="field span2"><label for="saleProduct">Изделие</label><select id="saleProduct" name="productId" required>${products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} — ${remainingFinished(p.id).qty} ${esc(productUnit(p))}</option>`).join('')}</select></div><div class="field"><label>Дата продажи</label><input type="date" name="date" max="${todayLocal()}" value="${todayLocal()}" required></div><div class="field"><label>Количество, шт.</label><input type="number" name="quantity" min="1" step="1" value="1" required></div><div class="field"><label>Цена за единицу, ₽</label><input type="number" name="unitPrice" min="0" step="any" value="0" required></div><div class="field"><label>Комиссия площадки, %</label><input type="number" name="commissionPct" min="0" max="100" step="any" value="0"></div><div class="field"><label>Дополнительная комиссия, ₽</label><input type="number" name="fixedFee" min="0" step="any" value="0"></div><div class="field"><label>Доставка за счёт продавца, ₽</label><input type="number" name="shipping" min="0" step="any" value="0"></div><div class="field"><label>Площадка / канал</label><input name="channel" maxlength="100" placeholder="Например, ярмарка"></div><div class="field"><label>Примечание</label><input name="note" maxlength="200" placeholder="Необязательно"></div></div><div class="notice" style="margin:18px 0">При сохранении спишется готовое изделие из самых ранних доступных партий. Себестоимость будет зафиксирована. Оплату от покупателя эта версия отдельно не отслеживает.</div><button class="btn btn-primary" type="submit" ${products.length?'':'disabled'}>${icon('bag',17)} Сохранить продажу</button></form>`}
function saleReturnsFor(saleId){return (state.saleReturns||[]).filter(t=>t.saleId===saleId)}
function returnPortions(sale,qty){const already=saleReturnsFor(sale.id).reduce((a,t)=>a+t.quantity,0);let skip=already,need=qty;const out=[];
 for(const alloc of [...sale.allocations].reverse()){
  if(skip>=alloc.qty){skip-=alloc.qty;continue}
  const take=Math.min(alloc.qty-skip,need);skip=0;need-=take;
  out.push({batchId:alloc.batchId,qty:take,unitCost:alloc.unitCost,cost:take*alloc.unitCost});if(!need)break;
 }
 return need>0?{error:'Количество возврата превышает доступное.'}:{allocations:out,cogs:out.reduce((a,x)=>a+x.cost,0)};
}
function buildReturn(v){
 const sale=(state.sales||[]).find(s=>s.id===v.saleId);if(!sale)return {error:'Продажа не найдена.'};
 if(!goodDate(v.date)||v.date<sale.date)return {error:'Дата возврата должна быть не раньше даты продажи и не позже сегодняшнего дня.'};
 const returned=saleReturnsFor(sale.id).reduce((a,t)=>a+t.quantity,0);
 if(!Number.isInteger(v.quantity)||v.quantity<1||v.quantity>sale.quantity-returned)return {error:'Укажите количество от 1 до '+(sale.quantity-returned)+'.'};
 const alreadyRefund=saleReturnsFor(sale.id).reduce((a,t)=>a+t.refund,0);
 if(!safeMoney(v.refund)||v.refund>sale.quantity*sale.unitPrice-alreadyRefund+1e-7||!safeMoney(v.extraCost))return {error:'Проверьте сумму возврата и дополнительные расходы; возврат не может превышать оставшуюся выручку.'};
 const portions=returnPortions(sale,v.quantity);if(portions.error)return portions;
 return {id:uid(),saleId:sale.id,productId:sale.productId,productName:sale.productName,createdAt:new Date().toISOString(),date:v.date,quantity:v.quantity,refund:v.refund,extraCost:v.extraCost,restock:!!v.restock,allocations:portions.allocations,cogs:portions.cogs,note:(v.note||'').trim().slice(0,200)};
}
function returnModal(id){const s=(state.sales||[]).find(s=>s.id===id);if(!s)return '';const returned=saleReturnsFor(id).reduce((a,t)=>a+t.quantity,0),left=s.quantity-returned,remainRefund=s.quantity*s.unitPrice-saleReturnsFor(id).reduce((a,t)=>a+t.refund,0);return `<div class="modal-shade" data-backdrop><div class="modal" role="dialog" aria-modal="true" aria-label="Оформить возврат"><div class="modal-head"><div><div class="overline">Продажа от ${dateFmt(s.date)}</div><h2>Возврат изделия</h2><p class="small">${esc(s.productName)} · можно вернуть ${left} шт.</p></div><button class="iconbtn" data-action="close-modal" aria-label="Закрыть">${icon('x')}</button></div><form id="saleReturnForm" data-sale-id="${esc(id)}"><div class="formgrid"><div class="field"><label>Дата возврата</label><input name="date" type="date" min="${s.date}" max="${todayLocal()}" value="${todayLocal()}" required></div><div class="field"><label>Количество</label><input name="quantity" type="number" min="1" max="${left}" step="1" value="1" required></div><div class="field"><label>Возвращено покупателю, ₽</label><input name="refund" type="number" min="0" max="${remainRefund}" step="any" value="${Math.min(s.unitPrice,remainRefund)}" required></div><div class="field"><label>Расходы на возврат, ₽</label><input name="extraCost" type="number" min="0" step="any" value="0"></div><div class="field span2"><label><input type="checkbox" name="restock" checked style="width:auto;min-height:auto;margin-right:8px">Изделие пригодно для продажи — вернуть на склад</label></div><div class="field span2"><label>Примечание</label><input name="note" maxlength="200" placeholder="Например, повреждена упаковка"></div></div><div class="notice" style="margin-top:15px">При возврате на склад восстанавливается себестоимость первоначальной партии. Если изделие непригодно, его стоимость остаётся расходом. Комиссии продажи не отменяются автоматически.</div><div class="modalactions"><button class="btn" type="button" data-action="close-modal">Отмена</button><button class="btn btn-primary" type="submit">Сохранить возврат</button></div></form></div></div>`}
function sales(){const fin=salesReport(),stock=state.products.map(p=>({...remainingFinished(p.id),product:p})).filter(x=>x.qty>0),rows=[...(state.sales||[])].reverse(),ret=[...(state.saleReturns||[])].reverse();return `${header('Продажи','Реализованные изделия, возвраты и прибыль по фактическим производственным партиям.')}<div class="production-stats sales-stats"><div class="card stock-metric"><div class="small">Выручка за вычетом возвратов</div><strong>${rub(fin.revenue)}</strong></div><div class="card stock-metric"><div class="small">Себестоимость проданного</div><strong>${rub(fin.cost)}</strong></div><div class="card stock-metric"><div class="small">Прибыль до налогов*</div><strong class="${fin.profit<0?'loss':''}">${rub(fin.profit)}</strong></div></div><div class="two-col"><div>${saleForm()}</div><div class="card cardpad" style="align-self:start"><div class="sectionline"><h2>Расчёт результата</h2><span class="tag ok">По записям</span></div><div class="sumrow"><span>Продажи</span><strong>${rub(fin.gross)}</strong></div><div class="sumrow"><span>Возвраты покупателям</span><strong>− ${rub(fin.refunds)}</strong></div><div class="sumrow"><span>Себестоимость изделий</span><strong>− ${rub(fin.cost)}</strong></div><div class="sumrow"><span>Комиссии</span><strong>− ${rub(fin.fees)}</strong></div><div class="sumrow"><span>Доставка продавца</span><strong>− ${rub(fin.shipping)}</strong></div><div class="sumrow"><span>Расходы на возвраты</span><strong>− ${rub(fin.returnsCost)}</strong></div><div class="sumrow strong"><span>Результат</span><strong style="color:${fin.profit<0?'var(--red)':'var(--green)'}">${rub(fin.profit)}</strong></div><div class="notice" style="margin-top:15px">* По учтённым затратам, без налогов и общих расходов мастерской. Продажа не подтверждает фактическое получение денег. Прибыль не равна остатку денег на счёте.</div></div></div><div class="card cardpad" style="margin-top:20px"><div class="sectionline"><h2>Готовые товары в наличии</h2><span class="small">После продаж и возвратов</span></div>${stock.length?`<div class="table-wrap"><table><thead><tr><th>Изделие</th><th>Остаток</th><th>Себестоимость запаса</th></tr></thead><tbody>${stock.map(x=>`<tr><td><button class="record-link" data-action="view-product" data-id="${esc(x.product.id)}">${esc(x.product.name)} ↗</button></td><td>${r(x.qty)} ${esc(productUnit(x.product))}</td><td>${rub(x.value)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="notice">Готовых изделий в наличии пока нет.</div>'}</div><div class="card cardpad" style="margin-top:20px"><div class="sectionline"><h2>История продаж</h2><span class="small">${rows.length} операций</span></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Дата</th><th>Изделие</th><th>Кол-во</th><th>Выручка</th><th>Прибыль до возврата</th></tr></thead><tbody>${rows.map(s=>`<tr class="clickrow" data-action="view-sale" data-id="${esc(s.id)}" tabindex="0"><td>${dateFmt(s.date)}</td><td><button class="record-link" data-action="view-sale" data-id="${esc(s.id)}">${esc(s.productName)} ↗</button><div class="small">${esc(s.channel||'Канал не указан')}</div></td><td>${s.quantity}</td><td>${rub(s.total)}</td><td>${rub(s.profit)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="notice">Продаж пока нет. Для начала нужна хотя бы одна выпущенная партия.</div>'}</div><div class="card cardpad" style="margin-top:20px"><div class="sectionline"><h2>История возвратов</h2><span class="small">${ret.length} записей</span></div>${ret.length?`<div class="table-wrap"><table><thead><tr><th>Дата</th><th>Изделие</th><th>Кол-во</th><th>Возврат денег</th><th>Товар</th></tr></thead><tbody>${ret.map(t=>`<tr><td>${dateFmt(t.date)}</td><td><button class="record-link" data-action="view-sale" data-id="${esc(t.saleId)}">${esc(t.productName)} ↗</button></td><td>${t.quantity}</td><td>${rub(t.refund)}</td><td>${t.restock?'<span class="tag ok">На складе</span>':'<span class="tag warn">Не пригоден</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="notice">Возвратов нет.</div>'}</div>`}
function saleDetail(id){const s=(state.sales||[]).find(s=>s.id===id);if(!s)return toast('Продажа не найдена','error');const total=salesTotal(s),ret=saleReturnsFor(id),returned=ret.reduce((a,t)=>a+t.quantity,0);const content=`<div class="detail-grid"><div class="detail-stat"><small>Продано</small><strong>${r(s.quantity)} ${esc(s.productUnit||'шт.')}</strong></div><div class="detail-stat"><small>Выручка</small><strong>${rub(s.total)}</strong></div><div class="detail-stat"><small>Себестоимость ФИФО</small><strong>${rub(s.cogs)}</strong></div></div><div class="subhead">Учёт продажи</div><div class="detail-list"><div class="detail-line"><span>Цена за штуку</span><strong>${rub(s.unitPrice)}</strong></div><div class="detail-line"><span>Комиссия</span><strong>${rub(total.commission)}</strong></div><div class="detail-line"><span>Доставка</span><strong>${rub(total.shipping)}</strong></div><div class="detail-line"><span>Результат до возвратов</span><strong>${rub(s.profit)}</strong></div></div><div class="subhead">Списанные партии</div><div class="detail-list">${s.allocations.map(a=>`<div class="detail-line"><button class="record-link" data-action="view-batch" data-id="${esc(a.batchId)}">${r(a.qty)} ед. · партия ↗</button><strong>${rub(a.cost)}</strong></div>`).join('')}</div><div class="subhead">Возвраты (${returned} из ${s.quantity})</div>${ret.length?`<div class="detail-list">${ret.map(t=>`<div class="detail-line"><span>${dateFmt(t.date)} · ${t.quantity} ед. ${t.restock?'(на склад)':'(брак)'}</span><strong>− ${rub(t.refund)}</strong></div>`).join('')}</div>`:'<p class="small">Пока нет.</p>'}${s.note?`<p class="small" style="margin-top:12px">Примечание: ${esc(s.note)}</p>`:''}`;openModal(detailShell('Продажа · '+dateFmt(s.date),s.productName,`Канал: ${s.channel||'не указан'} · себестоимость закреплена за партиями`,content,returned<s.quantity?`<button class="btn btn-primary" data-action="new-return" data-id="${esc(s.id)}">${icon('package',17)} Оформить возврат</button>`:''))}

function finishedFor(productId){const stock=remainingFinished(productId);return {...stock,batches:(state.productionBatches||[]).filter(b=>!b.cancelledAt&&b.productId===productId).length}}
function stats(){const ss=stockFor(),finished=(state.productionBatches||[]).filter(b=>!b.cancelledAt),ready=remainingFinished();return{count:state.materials.length,inventory:Object.values(ss).reduce((a,b)=>a+b.value,0),products:state.products.length,purchases:state.purchases.length,calculations:state.calculations.length,produced:finished.reduce((a,b)=>a+b.good,0),readyQty:ready.qty,finishedValue:ready.value,batches:finished.length,sold:(state.sales||[]).length,finance:salesReport()}}
function toast(message,type='ok'){document.getElementById('toastRoot').innerHTML=`<div class="toast ${type==='error'?'error':''}" role="status">${esc(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toastRoot').innerHTML='',4000)}
function updatePersistIndicator(){const elem=document.querySelector('.top .pill');if(!elem)return;elem.innerHTML=persisted?`<span style="width:6px;height:6px;background:#449476;border-radius:100%"></span><span class="label">Локально сохранено</span>`:`${icon('alert',13)} <span class="label">Нет сохранения</span>`}
function setView(next){closeModal();view=next;purchaseEditing=false;productEditing=null;window.scrollTo({top:0,behavior:'instant'});render()}
function navMarkup(mobile){return navs.map(([id,title,ic])=>`<button type="button" class="${mobile?'':'navbutton '} ${view===id?'active':''}" data-view="${id}" aria-current="${view===id?'page':'false'}">${icon(ic,mobile?20:18)}<span>${mobile&&id==='production'?'Выпуск':mobile&&id==='calculator'?'Расчёт':title}</span></button>`).join('')}
function render(){document.getElementById('sideNav').innerHTML=navMarkup(false);document.getElementById('mobileNav').innerHTML=navMarkup(true);document.getElementById('settingsNav').innerHTML=icon('gear',18)+' Настройки';document.getElementById('topSettings').innerHTML=icon('gear',18);document.getElementById('brandIcon').innerHTML=icon('layers',22);document.getElementById('crumb').textContent=navs.find(x=>x[0]===view)?.[1]||'';document.getElementById('main').innerHTML=({dashboard:dashboard,purchases:purchases,materials:materials,products:products,calculator:calculator,production:production,sales:sales})[view]();updatePersistIndicator();if(view==='materials')applyMaterialFilters();if(view==='calculator')refreshCalc();if(view==='sales')refreshSalePreview();if(view==='production'){renderBatchMaterials();refreshProductionPreview();}if(view==='products'&&productEditing)previewRecipe()}
function header(title,descr,buttons=''){return `<div class="heading"><div><h1>${title}</h1><p>${descr}</p></div><div class="actions">${buttons}</div></div>`}
function tableEmpty(name,txt,ic,button=''){return `<div class="empty"><div class="bubble">${icon(ic,29)}</div><h3>${name}</h3><p>${txt}</p>${button}</div>`}
function dashboardHero(){return `<section class="hero"><div class="hero-inner"><div class="eyebrow">${icon('spark',14)} Авторское рабочее пространство</div><h1>У каждой идеи<br>есть своя цена.</h1><p>Рассчитывайте материалы, работу и прибыль — для косметики, аромасмесей, свечей, саше и других изделий.</p><div class="hero-actions"><button class="btn btn-primary" data-view="calculator">${icon('calc',17)} Новый расчёт</button><button class="btn btn-secondary" data-action="new-purchase">${icon('plus',17)} Добавить закупку</button></div></div><div class="hero-art" aria-hidden="true"><div class="art-ring"></div><div class="art-square"></div><div class="art-dot"></div><div class="art-cross">✳</div></div></section>`}
function dashboard(){const s=stats(),ss=sums();const recent=state.purchases.slice().reverse().slice(0,4);const calcs=state.calculations.slice().reverse().slice(0,3);return `${dashboardHero()}
 ${categoryCardsMarkup()}
${!s.count?`<div class="banner"><div><h2>Начните с материалов</h2><p>Создайте первый материал и добавьте закупку. Или загрузите демонстрационные данные для знакомства с интерфейсом.</p></div><div class="actions"><button class="btn btn-primary" data-action="new-material">${icon('plus',16)} Материал</button><button class="btn" data-action="demo">Пример</button></div></div>`:''}
<div class="cards4"><button type="button" data-view="materials" class="card metric metric-button"><span class="metric-go">${icon('arrow',16)}</span><div class="iconwrap">${icon('package')}</div><div class="amount num">${rub(s.inventory,0)}</div><div class="desc">Стоимость материалов в наличии</div></button><button type="button" data-view="materials" class="card metric metric-button"><span class="metric-go">${icon('arrow',16)}</span><div class="iconwrap">${icon('layers')}</div><div class="amount num">${s.count}</div><div class="desc">Позиций материалов</div></button><button type="button" data-view="products" class="card metric metric-button"><span class="metric-go">${icon('arrow',16)}</span><div class="iconwrap">${icon('shapes')}</div><div class="amount num">${s.products}</div><div class="desc">Видов изделий</div></button><button type="button" data-view="production" class="card metric metric-button"><span class="metric-go">${icon('arrow',16)}</span><div class="iconwrap">${icon('file')}</div><div class="amount num">${s.readyQty}</div><div class="desc">Готовых изделий в наличии</div></button></div>

>Последние калькуляции</h3>${calcs.length?calcs.map(c=>`<div class="historyrow"><div><button class="record-link" data-action="view-calc" data-id="${c.id}">${esc(c.productName)} <span class="record-arrow">↗</span></button><div class="small">${dateFmt(c.date)} · ${c.goodQty} шт.</div></div><strong>${rub(c.unitCost)}</strong></div>`).join(''): '<p class="small">Сохранённых расчётов пока нет.</p>'}</div></div><div class="footer">Производственные партии уменьшают остатки материалов. Готовые изделия пока не списываются при продаже — учёт продаж добавим отдельно.</div>`}

function materials(){const ss=stockFor();let rows=state.materials;return `${header('Материалы','Фактические остатки после производства. Для эфирных масел можно учитывать капли.',`<button class="btn" data-action="categories">${icon('layers',16)} Категории</button><button class="btn btn-primary" data-action="new-material">${icon('plus')} Добавить материал</button>`)}<div class="card cardpad"><div class="materialsearch"><div><h2>Каталог материалов</h2><p class="small" style="margin:5px 0 0">${rows.length} ${rows.length===1?'позиция':'позиций'}</p></div>${rows.length?`<div class="material-filter-controls"><label class="filter-control-label" for="matCategoryFilter">Категория<select id="matCategoryFilter" aria-label="Фильтр по категориям"><option value="">Все категории</option><option value="__no_category__" ${materialCategoryFilter==='__no_category__'?'selected':''}>Без категории</option>${categoriesFromState(state).map(name=>`<option value="${esc(name)}" ${categoryKey(materialCategoryFilter)===categoryKey(name)?'selected':''}>${esc(name)}</option>`).join('')}</select></label><label class="filter-control-label" for="matSearch">Поиск<input type="search" class="search" id="matSearch" placeholder="Название или категория" aria-label="Поиск материалов"></label></div>`:''}</div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Материал</th><th>Поступило</th><th>Списано</th><th>Остаток</th><th>Цена ед.</th><th>Стоимость остатка</th><th class="alignright">Действия</th></tr></thead><tbody id="matRows">${rows.map(m=>{let b=ss[m.id]||{received:0,used:0,available:0,unitCost:null,value:0};return `<tr class="clickrow" data-category="${esc(m.category||'')}" data-search="${esc((m.name+' '+m.category).toLowerCase())}" data-action="view-material" data-id="${m.id}" tabindex="0"><td><button class="record-link" data-action="view-material" data-id="${m.id}">${esc(m.name)} <span class="record-arrow">↗</span></button><div class="small">${esc(m.category||'Без категории')}</div></td><td>${r(b.received,3)} ${esc(m.unit)}</td><td>${r(b.used,3)} ${esc(m.unit)}</td><td><strong>${r(b.available,3)} ${esc(m.unit)}</strong>${positive(m.min)>0&&b.available<positive(m.min)?' <span class="tag warn">Мало</span>':''}</td><td>${b.unitCost!==null?rub(b.unitCost,4):'<span class="tag warn">Нет закупок</span>'}</td><td>${rub(b.value)}</td><td class="alignright"><button class="link" data-action="edit-material" data-id="${m.id}">Изменить</button> <button class="link" data-action="delete-material" data-id="${m.id}" title="Удалить">${icon('trash',15)}</button></td></tr>`}).join('')}</tbody></table></div><div id="materialFilterEmpty" class="notice category-filter-empty hide" role="status">В выбранной категории материалы не найдены. Измените фильтр или добавьте новый материал.</div><div class="notice" style="margin-top:18px">Остаток = поступления минус списания на завершённые партии. Себестоимость материалов рассчитывается по средней закупочной цене, стоимость завершённых партий фиксируется отдельно.</div>`:tableEmpty('Материалов пока нет','Добавьте бумагу, ткань, упаковку или другие материалы. Далее зарегистрируйте закупку, чтобы появилась стоимость единицы.','package',`<button class="btn btn-primary" data-action="new-material">Добавить материал</button>`)}</div>`}
function newPurchase(){editingPurchaseId=null;purchaseEditing=true;purchaseDraft={id:uid(),date:todayLocal(),supplier:'',delivery:0,lines:[{id:uid(),materialId:state.materials[0]?.id||'',packs:1,packSize:1,price:0}]};view='purchases';render()}

function purchaseForm(){let p=purchaseDraft;return `<div class="card cardpad editpane"><div class="sectionline"><div><h2>${editingPurchaseId?'Редактирование закупки':'Новая закупка'}</h2><p class="small" style="margin:4px 0 0">Регистрируется как поступление материалов</p></div><button class="iconbtn" data-action="cancel-purchase" title="Закрыть">${icon('x')}</button></div><form id="purchaseForm"><div class="formgrid"><div class="field"><label for="purchaseDate">Дата покупки</label><input id="purchaseDate" name="date" type="date" required value="${esc(p.date)}"></div><div class="field"><label for="purchaseSupplier">Поставщик / магазин</label><input id="purchaseSupplier" name="supplier" maxlength="120" value="${esc(p.supplier)}" placeholder="Необязательно"></div></div><hr class="hr"><div class="sectionline"><h3>Позиции закупки</h3><span class="small">Ед. в упаковке — в единицах материала</span></div><div id="purchaseLines">${p.lines.map(purchaseLineHTML).join('')}</div><div class="lineactions"><button class="btn btn-small" type="button" data-action="add-purchase-line">${icon('plus',15)} Добавить позицию</button></div><hr class="hr"><div class="formgrid"><div class="field"><label for="purchaseDelivery">Доставка и общие расходы, ₽</label><input id="purchaseDelivery" name="delivery" type="number" min="0" step="any" value="${esc(p.delivery)}"><div class="help">Распределяется по стоимости позиций. Если все позиции бесплатны — поровну.</div></div><div class="summarypanel"><div class="sumrow"><span>Материалы</span><strong id="purchaseSubtotal">0 ₽</strong></div><div class="sumrow"><span>Доставка</span><strong id="purchaseFreight">0 ₽</strong></div><div class="sumrow strong"><span>Итого</span><strong id="purchaseTotal">0 ₽</strong></div></div></div><div class="actions" style="margin-top:22px"><button class="btn btn-primary" type="submit">${icon('check',17)} ${editingPurchaseId?'Сохранить изменения':'Сохранить поступление'}</button><button class="btn" type="button" data-action="cancel-purchase">Отмена</button></div></form></div>`}
function refreshPurchaseSummary(){const root=document.getElementById('purchaseForm');if(!root)return;let subtotal=Array.from(root.querySelectorAll('[data-line]')).reduce((a,row)=>a+positive(row.querySelector('[data-f="packs"]').value)*positive(row.querySelector('[data-f="price"]').value),0);let delivery=positive(root.querySelector('[name="delivery"]').value);document.getElementById('purchaseSubtotal').textContent=rub(subtotal);document.getElementById('purchaseFreight').textContent=rub(delivery);document.getElementById('purchaseTotal').textContent=rub(subtotal+delivery)}
function purchases(){return `${header('Закупки','Регистрируйте покупки в упаковках, листах, метрах и других единицах.',`<button class="btn btn-primary" data-action="new-purchase" ${state.materials.length?'':'disabled title="Сначала создайте материал"'}>${icon('plus')} Новая закупка</button>`)}${purchaseEditing?purchaseForm():''}<div class="card cardpad"><div class="sectionline"><h2>История закупок</h2><span class="small">${state.purchases.length} записей</span></div>${state.purchases.length?`<div class="table-wrap"><table><thead><tr><th>Дата</th><th>Поставщик</th><th>Позиции</th><th class="alignright">Стоимость</th><th></th></tr></thead><tbody>${state.purchases.slice().reverse().map(p=>`<tr class="clickrow" data-action="view-purchase" data-id="${p.id}" tabindex="0"><td><button class="record-link" data-action="view-purchase" data-id="${p.id}">${dateFmt(p.date)} <span class="record-arrow">↗</span></button></td><td>${esc(p.supplier||'Не указан')}</td><td>${p.lines.length} <span class="small">(${esc(p.lines.map(x=>byId(x.materialId)?.name||'Не найден').join(', '))})</span></td><td class="alignright"><strong>${rub(purchasedTotal(p))}</strong></td><td><button class="link" data-action="delete-purchase" data-id="${p.id}" title="Удалить закупку">${icon('trash',15)}</button></td></tr>`).join('')}</tbody></table></div>`:tableEmpty('Закупок пока нет',state.materials.length?'Добавьте первую закупку — приложение распределит доставку и посчитает стоимость единицы.':'Сначала добавьте материал в справочник, затем можно регистрировать закупки.','cart',`<button class="btn" data-action="${state.materials.length?'new-purchase':'new-material'}">${state.materials.length?'Создать закупку':'Создать материал'}</button>`)}</div>`}
function newProduct(id=null){productEditing=id||'new';let p=byProduct(id)||{name:'',sku:'',category:'',recipe:[],labor:[]};productDraft=JSON.parse(JSON.stringify(p));if(!id)productDraft.recipe=[];view='products';render()}
function recipeRow(x,i){const m=byId(x.materialId);return `<div class="itemrow recipe recipe-row" data-recipe="${i}"><div class="field"><div class="mini-label">Материал</div><select data-f="materialId">${state.materials.map(a=>`<option value="${a.id}" ${a.id===x.materialId?'selected':''}>${esc(a.name)} (${esc(a.unit)})</option>`).join('')}</select></div><div class="field"><div class="mini-label">Количество на изделие или доля, %</div><input type="number" min="0.000001" step="any" data-f="qty" value="${esc(x.qty)}" placeholder="Введите расход" aria-label="Расход на единицу изделия"></div><div class="field"><div class="mini-label">Единица расхода</div><select data-f="measure" aria-label="Единица расхода">${recipeMeasureOptions(m,x.measure,productDraft)}</select></div><button type="button" class="iconbtn remove" data-action="remove-recipe" data-index="${i}" aria-label="Удалить материал">${icon('trash',16)}</button></div>`}
function laborRow(x,i){return `<div class="itemrow labor" data-labor="${i}"><div class="field"><div class="mini-label">Операция</div><input data-f="name" value="${esc(x.name)}" maxlength="80" placeholder="Например, резка"></div><div class="field"><div class="mini-label">Минут</div><input data-f="minutes" type="number" min="0" step="any" value="${esc(x.minutes)}"></div><div class="field"><div class="mini-label">₽ / час</div><input data-f="rate" type="number" min="0" step="any" value="${esc(x.rate)}"></div><div class="field"><div class="mini-label">Как учитывать</div><select data-f="scope"><option value="unit" ${x.scope==='unit'?'selected':''}>На 1 шт.</option><option value="batch" ${x.scope==='batch'?'selected':''}>На всю партию</option></select></div><button type="button" class="iconbtn remove" data-action="remove-labor" data-index="${i}" aria-label="Удалить операцию">${icon('trash',16)}</button></div>`}
function captureProduct(){const root=document.getElementById('productForm');if(!root)return;productDraft.name=root.querySelector('[name="name"]').value;productDraft.sku=root.querySelector('[name="sku"]').value;productDraft.category=root.querySelector('[name="category"]').value;productDraft.productUnit=root.querySelector('[name="productUnit"]').value;productDraft.outputValue=root.querySelector('[name="outputValue"]').value;productDraft.outputUnit=root.querySelector('[name="outputUnit"]').value;productDraft.recipe=Array.from(root.querySelectorAll('[data-recipe]')).map(el=>({materialId:el.querySelector('[data-f="materialId"]').value,qty:el.querySelector('[data-f="qty"]').value,measure:el.querySelector('[data-f="measure"]').value}));productDraft.labor=Array.from(root.querySelectorAll('[data-labor]')).map(el=>({name:el.querySelector('[data-f="name"]').value,minutes:el.querySelector('[data-f="minutes"]').value,rate:el.querySelector('[data-f="rate"]').value,scope:el.querySelector('[data-f="scope"]').value}))}
function productForm(){const p=productDraft;return `<div class="card cardpad editpane"><div class="sectionline"><div><h2>${productEditing==='new'?'Новое изделие':'Редактировать изделие'}</h2><p class="small" style="margin:5px 0 0">Рецептура и работа попадут в расчёт себестоимости</p></div><button class="iconbtn" data-action="cancel-product" title="Закрыть">${icon('x')}</button></div><form id="productForm"><div class="formgrid cols3"><div class="field"><label>Название *</label><input name="name" value="${esc(p.name)}" maxlength="120" required autocomplete="off" placeholder="Например, аромасмесь 10 мл"></div><div class="field"><label>Артикул</label><input name="sku" value="${esc(p.sku)}" maxlength="60" placeholder="MIX-001"></div><div class="field"><label>Направление / категория</label><input name="category" list="productCategories" value="${esc(p.category)}" maxlength="80" placeholder="Предложим по названию"><datalist id="productCategories">${[...new Set([...CATEGORY_PRESETS.map(c=>c.name),...productDirections()])].map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist><div class="help">Новое название станет направлением после сохранения изделия.</div></div></div><div class="direction-suggestion" id="directionSuggestion" aria-live="polite">${productSuggestionMarkup(p.name,p.category)}</div><div class="recipe-settings"><div class="field"><label>Единица готового товара</label><select name="productUnit">${['шт.','флакон','баночка','саше','свеча','набор','упаковка'].map(u=>`<option ${productUnit(p)===u?'selected':''}>${u}</option>`).join('')}</select></div><div class="field"><label>Объём / масса готового товара (необязательно)</label><input type="number" min="0" step="any" name="outputValue" value="${esc(p.outputValue??'')}" placeholder="Например, 10"></div><div class="field"><label>Единица объёма / массы</label><select name="outputUnit">${['мл','г'].map(u=>`<option ${p.outputUnit===u?'selected':''}>${u}</option>`).join('')}</select></div></div><div class="recipe-hint" id="recipeHint">${esc(directionHelp(p.category))}</div><div class="template-panel"><div class="subhead">Подсказка по составу</div><div id="templateRoles">${templateRolesMarkup(p.category)}</div><p class="help" style="margin:8px 0 0">Это не готовая рецептура: приложение не назначает дозировки и не проверяет безопасность косметических формул.</p></div><hr class="hr"><div class="sectionline"><h3>Состав одного изделия</h3><span class="small">Купленные материалы и фактический расход</span></div>${state.materials.length?`<div id="recipeRows">${p.recipe.map(recipeRow).join('')}</div><button type="button" class="btn btn-small" data-action="add-recipe">${icon('plus',15)} Добавить ингредиент</button>`:`<div class="notice warn">Сначала создайте материалы в справочнике. Для эфирного масла выберите единицу «мл», затем в рецептуре можно будет вводить капли.</div>`}<div class="notice" style="margin-top:15px">Проценты рассчитываются от массы или объёма готового изделия, заданного выше. Массу нельзя пересчитать в объём без плотности конкретного компонента. Для эфирных масел: 1 мл ≈ 30 капель, коэффициент изменяется в карточке материала.</div><div class="recipe-preview"><div class="sectionline"><div><h3>Расчёт рецептуры для партии</h3><p class="small">Проверьте расход перед сохранением</p></div><div class="field"><label for="previewBatchCount">Количество изделий</label><input id="previewBatchCount" type="number" min="1" step="1" value="1" style="max-width:145px"></div></div><div id="recipePreview" aria-live="polite"></div></div><hr class="hr"><div class="sectionline"><h3>Операции и оплата труда</h3><span class="small">Время на штуку или на партию</span></div><div id="laborRows">${p.labor.map(laborRow).join('')}</div><button type="button" class="btn btn-small" data-action="add-labor">${icon('plus',15)} Добавить операцию</button><div class="notice" style="margin-top:19px">Наценку, брак, разовые расходы и цену продажи можно менять при каждом расчёте партии.</div><div class="actions" style="margin-top:22px"><button type="submit" class="btn btn-primary">${icon('check',16)} Сохранить изделие</button><button type="button" class="btn" data-action="cancel-product">Отмена</button></div></form></div>`}
function unitRecipeCost(p){const b=recipeBreakdown(p,1);return {cost:b.cost||0,missing:b.error?[b.error]:(b.missing||[]),error:b.error,warning:b.warning}}
function previewRecipe(){
  const target=document.getElementById('recipePreview'),form=document.getElementById('productForm');if(!target||!form)return;
  const batch=n(document.getElementById('previewBatchCount')?.value),p={outputValue:form.elements.namedItem('outputValue').value,outputUnit:form.elements.namedItem('outputUnit').value,recipe:Array.from(form.querySelectorAll('[data-recipe]')).map(el=>({materialId:el.querySelector('[data-f="materialId"]').value,qty:el.querySelector('[data-f="qty"]').value,measure:el.querySelector('[data-f="measure"]').value}))};
  if(!Number.isInteger(batch)||batch<1||batch>100000){target.innerHTML='<div class="notice warn">Количество изделий должно быть целым от 1 до 100 000.</div>';return}
  if(!p.recipe.length){target.innerHTML='<p class="small">Добавьте хотя бы один ингредиент, чтобы увидеть расход партии.</p>';return}
  const b=recipeBreakdown(p,batch);
  if(b.error){target.innerHTML='<div class="notice warn">'+esc(b.error)+'</div>';return}
  const total=n(p.outputValue)>0?`<span class="pill">Общий выход: ${r(n(p.outputValue)*batch,3)} ${esc(p.outputUnit)}</span>`:'';
  target.innerHTML=`<div class="details" style="margin-bottom:12px">${total}${b.percentSum?`<span class="pill">Проценты: ${r(b.percentSum,3)}%</span>`:''}</div><div class="recipe-preview-list">${b.lines.map(l=>`<div class="recipe-preview-line"><span>${esc(l.name)}${l.mode==='percent'?` <small>(${r(l.share,3)}%)</small>`:''}</span><strong>${r(l.quantity,4)} ${esc(l.unit)}${l.drops!==null?` <small>(${r(l.drops,2)} кап.)</small>`:''}</strong><span>${l.cost===null?'Нет цены':rub(l.cost)}</span></div>`).join('')}</div><div class="sumrow strong"><span>Материалы на партию</span><strong>${b.missing.length?'Не все цены известны':rub(b.cost)}</strong></div>${b.warning?`<div class="notice warn">${esc(b.warning)}</div>`:''}`;
}

function compute(v){let p=byProduct(v?.productId);if(!p)return {error:'Выберите изделие.'};if(!Number.isInteger(v.planned)||!Number.isInteger(v.good)||v.planned<1||v.good<1||v.good>v.planned)return {error:'Количество годных изделий должно быть от 1 до количества изготовленных.'};if([v.setup,v.other,v.sale,v.fee,v.target].some(x=>!Number.isFinite(x)||x<0)||v.fee>99||v.target>99)return{error:'Проверьте суммы и проценты в полях расчёта.'};const u=unitRecipeCost(p);if(u.error)return {error:u.error};if(u.missing.length)return {error:'Нет закупочной цены для материалов: '+[...new Set(u.missing)].join(', ')+'. Создайте закупки.'};const batches=recipeBreakdown(p,v.planned);const mat=batches.cost, labor=(p.labor||[]).reduce((s,l)=>s+positive(l.minutes)*positive(l.rate)/60*(l.scope==='batch'?1:v.planned),0);const total=mat+labor+v.setup+v.other,unitCost=total/v.good,revenue=v.good*v.sale,feeAmount=revenue*v.fee/100,profit=revenue-total-feeAmount,margin=revenue?profit/revenue*100:0;let divisor=1-v.fee/100-v.target/100,targetPrice=divisor>0?unitCost/divisor:null;return{productName:p.name,mat,labor,other:v.setup+v.other,total,unitCost,revenue,feeAmount,profit,margin,targetPrice,planned:v.planned,good:v.good,sale:v.sale,fee:v.fee,components:[mat,labor,v.setup+v.other],recipeSnapshot:batches.lines,recipeWarning:batches.warning,outputTotal:n(p.outputValue)>0?n(p.outputValue)*v.planned:null,outputUnit:p.outputUnit||'мл'}}
function calcResults(out){if(out.error)return `<div class="notice warn">${icon('alert',16)} ${esc(out.error)}</div>`;let [mat,labor,other]=out.components;const colors=['#d67a5d','#78aaa0','#989cc4'];let entries=[['Материалы',mat],['Работа',labor],['Прочие затраты',other]];return `<div class="subhead">Себестоимость одного годного изделия</div><div class="bigprice num">${rub(out.unitCost)}</div><div class="small" style="margin-top:6px">Общие затраты партии: <strong>${rub(out.total)}</strong></div><div class="breakdown">${entries.map((x,i)=>`<span style="width:${out.total?x[1]/out.total*100:0}%;background:${colors[i]}"></span>`).join('')}</div><div class="legend">${entries.map((x,i)=>`<div class="legendline"><span><i class="dot" style="background:${colors[i]}"></i>${x[0]}</span><strong>${rub(x[1])}</strong></div>`).join('')}</div><hr class="hr"><div class="subhead">Ингредиенты на партию ${out.planned} ед.</div>${out.outputTotal!==null?`<p class="small">Плановый выход: ${r(out.outputTotal,3)} ${esc(out.outputUnit)}</p>`:''}<div class="calc-ingredients">${out.recipeSnapshot.map(l=>`<div class="calc-ingredient"><span>${esc(l.name)}</span><strong>${r(l.quantity,4)} ${esc(l.unit)}</strong><span>${rub(l.cost)}</span></div>`).join('')}</div>${out.recipeWarning?`<div class="notice warn">${esc(out.recipeWarning)}</div>`:''}<hr class="hr"><div class="subhead">Продажа всех ${out.good} годных изделий</div><div class="sumrow"><span>Ожидаемая выручка</span><strong>${rub(out.revenue)}</strong></div><div class="sumrow"><span>Производственная себестоимость</span><strong>− ${rub(out.total)}</strong></div><div class="sumrow"><span>Комиссия</span><strong>− ${rub(out.feeAmount)}</strong></div><div class="sumrow strong"><span>Ожидаемая прибыль</span><strong style="color:${out.profit>=0?'var(--green)':'var(--red)'}">${rub(out.profit)}</strong></div><div class="small" style="margin-top:7px">Доля прибыли в выручке: <strong>${r(out.margin,1)}%</strong></div><hr class="hr"><div class="notice ${out.targetPrice!==null?'good':'warn'}">${out.targetPrice!==null?`Для желаемой доли прибыли цена должна быть не ниже <strong>${rub(out.targetPrice)}</strong> за штуку, при указанной комиссии.`:'Целевую долю прибыли при указанной комиссии получить невозможно: сумма процентов не должна превышать или равняться 100%.'}</div><p class="help" style="margin-top:12px">Прогноз до налогов и расходов, не указанных в расчёте. Продажи и прибыль пока не регистрируются.</p>`}

function buildProduction(v){
 const p=byProduct(v?.productId);if(!p)return {error:'Выберите изделие.'};
 if(!Number.isInteger(v.planned)||!Number.isInteger(v.good)||v.planned<1||v.planned>100000||v.good<1||v.good>v.planned)return {error:'Проверьте количество: изготовлено от 1 до 100 000, годных — не больше изготовленного.'};
 if(!/^\d{4}-\d\d-\d\d$/.test(v.date)||!Number.isFinite(Date.parse(v.date))||new Date(v.date+'T12:00:00').getDate()!==Number(v.date.slice(8,10))||v.date>todayLocal())return {error:'Укажите действительную дату выпуска, не позднее сегодняшней.'};
 if(!Number.isFinite(v.extraLabor)||v.extraLabor<0||!Number.isFinite(v.other)||v.other<0)return {error:'Дополнительная работа и прочие расходы не могут быть отрицательными.'};
 const rec=recipeBreakdown(p,v.planned);if(rec.error)return {error:rec.error};
 if(rec.missing.length)return {error:'Для выпуска не хватает закупочных цен: '+[...new Set(rec.missing)].join(', ')};
 const stock=stockFor(),totals={};const lines=[];
 for(const [i,item] of (p.recipe||[]).entries()){
  const usage=recipeUsage(item,p);if(usage.error)return {error:usage.error};
  const material=byId(item.materialId);const actual=v.materialLines?.[i];
  if(actual&&actual.materialId!==item.materialId)return {error:'Состав партии изменился. Откройте выпуск заново.'};
  const quantity=actual?actual.quantity:usage.qty*v.planned;
  if(!Number.isFinite(quantity)||quantity<0||quantity>1e12)return {error:'Проверьте фактический расход материала «'+material.name+'».'};
  const price=stock[item.materialId]?.unitCost;
  if(price===null||price===undefined)return {error:'Нет закупочной цены: '+(material?.name||'материал')};
  totals[item.materialId]=(totals[item.materialId]||0)+quantity;
  lines.push({materialId:item.materialId,name:material.name,unit:material.unit,quantity,recommended:usage.qty*v.planned,unitCost:price,cost:quantity*price,measure:item.measure||'base'});
 }
 for(const [id,quantity] of Object.entries(totals)){
  const available=stock[id]?.available||0;
  if(quantity>available+1e-7)return {error:`Не хватает «${byId(id)?.name||'Материал'}»: требуется ${r(quantity,4)}, доступно ${r(available,4)} ${byId(id)?.unit||''}. Добавьте закупку или уменьшите тираж.`};
 }
 const plannedLabor=(p.labor||[]).reduce((a,line)=>a+positive(line.minutes)*positive(line.rate)/60*(line.scope==='batch'?1:v.planned),0);
 const mat=lines.reduce((a,line)=>a+line.cost,0),labor=plannedLabor+v.extraLabor,total=mat+labor+v.other;
 return {productId:p.id,productName:p.name,productUnit:productUnit(p),planned:v.planned,good:v.good,rejected:v.planned-v.good,date:v.date,note:v.note||'',mat,labor,plannedLabor,extraLabor:v.extraLabor,other:v.other,totalCost:total,unitCost:total/v.good,recipeSnapshot:lines,warning:rec.warning};
}
