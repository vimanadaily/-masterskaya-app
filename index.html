function materialDetail(id){const m=byId(id);if(!m)return toast('Материал не найден','error');const purchases=state.purchases.filter(p=>p.lines.some(l=>l.materialId===id));const related=state.products.filter(p=>p.recipe.some(l=>l.materialId===id));const ss=stockFor()[id]||{received:0,used:0,available:0,unitCost:null,value:0};const body=`<div class="detail-grid"><div class="detail-stat"><small>Поступило</small><strong>${r(ss.received,3)} ${esc(m.unit)}</strong></div><div class="detail-stat"><small>Цена единицы</small><strong>${ss.unitCost!==null?rub(ss.unitCost,4):'Не определена'}</strong></div><div class="detail-stat"><small>Доступно сейчас</small><strong>${r(ss.available,3)} ${esc(m.unit)}</strong></div></div><div class="subhead">История поступлений</div><div class="detail-list">${purchases.length?purchases.slice().reverse().map(p=>`<div class="detail-line"><button class="record-link" data-action="view-purchase" data-id="${p.id}">${dateFmt(p.date)} · ${esc(p.supplier||'Без поставщика')} ↗</button><strong>${r(p.lines.filter(l=>l.materialId===id).reduce((a,l)=>a+positive(l.packs)*positive(l.packSize),0),3)} ${esc(m.unit)}</strong></div>`).join(''):'<div class="detail-line">Закупок ещё не было</div>'}</div><div class="subhead">Используется в изделиях</div><div class="detail-list">${related.length?related.map(p=>`<div class="detail-line"><button class="record-link" data-action="view-product" data-id="${p.id}">${esc(p.name)} ↗</button><strong>${r(p.recipe.filter(l=>l.materialId===id).reduce((a,l)=>a+positive(l.qty),0),3)} ${esc(m.unit)} / шт.</strong></div>`).join(''):'<div class="detail-line">Пока не используется</div>'}</div>`;openModal(detailShell(m.category||'Материал',m.name,'Единица учёта: '+m.unit+'. Показаны поступления и списания на производство.',body,`<button class="btn btn-primary" data-action="edit-material" data-id="${m.id}">${icon('edit',17)} Изменить материал</button>`))}
function purchaseDetail(id){const p=state.purchases.find(p=>p.id===id);if(!p)return toast('Закупка не найдена','error');let raw=(p.lines||[]).map(x=>positive(x.packs)*positive(x.price)),sum=raw.reduce((a,b)=>a+b,0),delivery=positive(p.delivery);const body=`<div class="detail-grid"><div class="detail-stat"><small>Товары</small><strong>${rub(sum)}</strong></div><div class="detail-stat"><small>Доставка</small><strong>${rub(delivery)}</strong></div><div class="detail-stat"><small>Итого</small><strong>${rub(sum+delivery)}</strong></div></div><div class="subhead">Позиции закупки</div><div class="detail-list">${p.lines.map((l,i)=>{const m=byId(l.materialId),total=positive(l.packs)*positive(l.packSize),freight=raw.length?(sum>0?delivery*raw[i]/sum:delivery/raw.length):0;return `<div class="detail-line"><div><button class="record-link" data-action="view-material" data-id="${esc(l.materialId)}">${esc(m?.name||'Материал удалён')} ↗</button><div class="small" style="margin-top:5px">${r(l.packs)} уп. × ${r(l.packSize,3)} = ${r(total,3)} ${esc(m?.unit||'ед.')}; доля доставки ${rub(freight)}</div></div><strong>${rub(raw[i]+freight)}</strong></div>`}).join('')}</div><p class="help" style="margin-top:12px">Если изменить цену или количество, стоимость материалов и будущие расчёты пересчитаются. Сохранённые калькуляции останутся неизменными.</p>`;openModal(detailShell('Закупка · '+dateFmt(p.date),p.supplier||'Без названия поставщика',`Дата: ${dateFmt(p.date)} · ${p.lines.length} позиций`,body,`<button class="btn btn-primary" data-action="edit-purchase" data-id="${p.id}">${icon('edit',17)} Редактировать закупку</button>`))}

 class="btn btn-primary" data-action="repeat-calc" data-id="${c.id}" ${byProduct(c.productId)?'':'disabled title="Изделие было удалено"'}>${icon('calc',17)} Повторить с этими параметрами</button>`))}

function applyMaterialFilters(){
  const query=(document.getElementById('matSearch')?.value||'').trim().toLocaleLowerCase('ru-RU');
  const selected=document.getElementById('matCategoryFilter')?.value??materialCategoryFilter;
  materialCategoryFilter=selected;
  let matches=0;
  document.querySelectorAll('#matRows tr').forEach(row=>{
    const category=row.dataset.category||'';
    const allowed=!selected || (selected==='__no_category__'?!category:categoryKey(category)===categoryKey(selected));
    const visible=allowed&&(row.dataset.search||'').toLocaleLowerCase('ru-RU').includes(query);
    row.classList.toggle('hide',!visible);
    if(visible)matches++;
  });
  const empty=document.getElementById('materialFilterEmpty');
  if(empty)empty.classList.toggle('hide',matches>0);
}

document.addEventListener('input',e=>{if(e.target.closest('#saleForm'))refreshSalePreview();if(e.target.closest('#purchaseForm'))refreshPurchaseSummary();if(e.target.closest('#batchForm')){if(e.target.name==='planned')renderBatchMaterials();refreshProductionPreview();}if(e.target.closest('#calcForm')){const latest=calcInput();if(latest)calcDraft={planned:latest.planned,good:latest.good,setup:latest.setup,other:latest.other,sale:latest.sale,fee:latest.fee,target:latest.target};refreshCalc();}if(e.target.id==='matSearch')applyMaterialFilters();if(e.target.closest('#productForm')||e.target.id==='previewBatchCount')previewRecipe();if(e.target.matches('#productForm [name=name],#productForm [name=category]'))renderDirectionSuggestion() });
document.addEventListener('change',e=>{if(e.target.closest('#batchForm')){if(e.target.name==='productId'){productionSelected=e.target.value;renderBatchMaterials()}refreshProductionPreview();}if(e.target.id==='matCategoryFilter'){materialCategoryFilter=e.target.value;applyMaterialFilters()}if(e.target.id==='matUnit'){const wrap=document.getElementById('dropsPerMlWrap');if(wrap)wrap.style.display=e.target.value==='мл'?'':'none'}if(e.target.matches('#productForm [name=category]'))renderDirectionSuggestion();if(e.target.matches('#productForm [data-f=materialId]')){const row=e.target.closest('[data-recipe]'),m=byId(e.target.value);if(row){const select=row.querySelector('[data-f=measure]');select.innerHTML=recipeMeasureOptions(m,'base');}}if(e.target.closest('#productForm'))previewRecipe();if(e.target.closest('#calcForm')){if(e.target.name==='productId')calcSelected=e.target.value;refreshCalc()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.clickrow')&&!e.target.closest('input,select,textarea,button')){e.preventDefault();const a=e.target.dataset.action,id=e.target.dataset.id;if(a==='view-material')materialDetail(id);if(a==='view-purchase')purchaseDetail(id);if(a==='view-product')productDetail(id);if(a==='view-calc')calcDetail(id);if(a==='view-batch')batchDetail(id);if(a==='view-sale')saleDetail(id)}});
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>5*1024*1024)throw Error('Файл больше 5 МБ.');const imported=JSON.parse(await file.text());if(!validImport(imported))throw Error('Неподдерживаемая или повреждённая копия.');if(!confirm('Импорт заменит ВСЕ текущие данные. Продолжить?'))return;state=initializeCategories({schemaVersion:1,materials:imported.materials,purchases:imported.purchases,products:imported.products,calculations:imported.calculations,productionBatches:imported.productionBatches||[],sales:imported.sales||[],saleReturns:imported.saleReturns||[],...(Array.isArray(imported.materialCategories)?{materialCategories:imported.materialCategories}:{})});save();closeModal();setView('dashboard');toast('Резервная копия импортирована')}catch(err){toast('Не удалось импортировать: '+err.message,'error')}});
render();
